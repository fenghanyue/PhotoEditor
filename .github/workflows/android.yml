name: 编译 APK

on:
  push:
  # 保留手动入口；通常改 .github/release-version 并合并到 main 即可发版
  workflow_dispatch:
    inputs:
      release:
        description: 发正式版：填版本号（如 0.4.1），要和 app/build.gradle.kts 里的 appVersion 一样；留空只编译
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  # main 按提交分别运行，普通提交不能取消前一次发版；开发分支仍取消旧编译
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'development' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_INPUT: ${{ inputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 检查发布流程
        run: python3 -B -m unittest discover -s tools/release -p 'test_*.py' -v

      - name: 确定本次是否发正式版
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/release/prepare_release.py

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: 编译、单元测试、代码检查
        run: ./gradlew --stacktrace assembleRelease testDebugUnitTest lintDebug

      - name: 整理 APK
        run: |
          mkdir -p dist
          # 正式版用版本号命名，测试版用编译序号
          cp app/build/outputs/apk/release/app-release.apk "dist/PhotoEditor-${RELEASE_VERSION:-${{ github.run_number }}}.apk"

      - uses: actions/upload-artifact@v6
        with:
          name: PhotoEditor-${{ github.run_number }}
          path: dist/*.apk
          overwrite: true

      # 只由开发分支更新；main 上的提交都在开发分支上测过，不再重复发一个一样的测试版
      - name: 更新 Releases 里的"最新测试版"
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/claude/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest-dev --yes --cleanup-tag || true
          gh release create latest-dev dist/*.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "最新测试版（第 ${{ github.run_number }} 次编译）" \
            --notes "分支 ${GITHUB_REF_NAME}，提交 ${GITHUB_SHA::7}。用手机浏览器下载 APK 后直接安装。"

      - name: 上传前再次检查版本
        if: env.RELEASE_VERSION != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/release/prepare_release.py --check-existing

      # 编译、测试和代码检查全部通过后，才打标签并发正式版
      - name: 发布正式版
        if: env.RELEASE_VERSION != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$RELEASE_VERSION"
          gh release create "v$version" dist/*.apk \
            --target "$GITHUB_SHA" \
            --title "PhotoEditor $version" \
            --notes-file dist/release-notes.md
