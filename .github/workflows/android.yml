name: 编译 APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: 编译、单元测试、代码检查
        run: ./gradlew --stacktrace assembleRelease testDebugUnitTest lintDebug

      - name: 整理 APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/PhotoEditor-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v6
        with:
          name: PhotoEditor-${{ github.run_number }}
          path: dist/*.apk

      - name: 更新 Releases 里的"最新测试版"
        if: github.event_name == 'push' && (github.ref_name == 'main' || startsWith(github.ref_name, 'claude/'))
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest-dev --yes --cleanup-tag || true
          gh release create latest-dev dist/*.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "最新测试版（第 ${{ github.run_number }} 次编译）" \
            --notes "分支 ${GITHUB_REF_NAME}，提交 ${GITHUB_SHA::7}。用手机浏览器下载 APK 后直接安装。"
